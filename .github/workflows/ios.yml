name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "ios/**"
      - "contracts/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator was found")
          ')"
          echo "SIMULATOR_UDID=${simulator_udid}" >> "$GITHUB_ENV"
      - name: Build and run unit and UI tests
        run: >-
          xcodebuild test
          -project ios/Acquiring.xcodeproj
          -scheme Acquiring
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}"
          CODE_SIGNING_ALLOWED=NO
