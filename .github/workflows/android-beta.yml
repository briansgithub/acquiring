name: Android beta
run-name: Android beta ${{ inputs.mode }} ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full approved main commit SHA (already pushed)
        required: true
        type: string
      release_notes:
        description: English release notes, 1–500 characters
        required: true
        type: string
      mode:
        description: Validate first; publish only on an explicit release command
        required: true
        default: validate
        type: choice
        options: [validate, publish]

permissions:
  contents: read

# Queued runs never interrupt an upload. The dispatcher also rejects overlapping runs.
concurrency:
  group: acquiring-android-beta
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.commit_sha }}
  RELEASE_NOTES: ${{ inputs.release_notes }}
  RELEASE_MODE: ${{ inputs.mode }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_OPT_OUT_USAGE: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_SKIP_DOCS: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main dispatch before source checkout
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = briansgithub/acquiring
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

  test:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.repository == 'briansgithub/acquiring'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unapproved source
        run: python3 android/scripts/android_beta.py guard
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests and instrumentation compilation
        run: ./android/gradlew -p android testDebugUnitTest compileDebugAndroidTestKotlin
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.22"
      - name: Release regression tests
        working-directory: android/fastlane
        env:
          BUNDLE_FROZEN: "true"
        run: |
          bundle install --jobs 4 --retry 0
          bundle exec ruby tests/beta_release_test.rb
          python3 ../scripts/test_android_beta.py
          python3 ../scripts/test_release_signing.py

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.repository == 'briansgithub/acquiring'
    runs-on: ubuntu-latest
    environment: android-beta
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/android/fastlane/Gemfile
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck pinned source and setup
        env:
          WIF_PROVIDER: ${{ vars.ANDROID_WIF_PROVIDER }}
          PLAY_ACCOUNT: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 android/scripts/android_beta.py guard
          test -n "$WIF_PROVIDER" && test -n "$PLAY_ACCOUNT"
          test "$RELEASE_MODE" = validate || test "$RELEASE_MODE" = publish
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.22"
      - name: Install locked release dependencies (no cache)
        run: bundle install --jobs 4 --retry 0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ANDROID_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Discover API track identifiers for validation/setup
        if: inputs.mode == 'validate'
        working-directory: android
        run: bundle exec fastlane android discover
      - name: Inspect Play and allocate version
        working-directory: android
        run: bundle exec fastlane android prepare
      - name: Build and verify the single signed bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ACQUIRING_RELEASE_STORE_FILE: ${{ runner.temp }}/android-upload.jks
          ACQUIRING_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ACQUIRING_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ACQUIRING_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          path = os.environ['ACQUIRING_RELEASE_STORE_FILE']
          raw = os.environ.pop('UPLOAD_KEYSTORE_BASE64', '')
          if not raw:
              raise SystemExit('Upload keystore secret is missing')
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as f:
              f.write(base64.b64decode(raw, validate=True))
          PY
          unset UPLOAD_KEYSTORE_BASE64
          bundle exec fastlane android build
      - name: Remove upload key before publishing
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'android-upload.jks').unlink(missing_ok=True)
          PY
      # Refresh OIDC after the build; do not rely on the pre-build token's lifetime.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.ANDROID_WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Validate or publish both pinned testing tracks
        working-directory: android
        run: bundle exec fastlane android submit
      - name: Remove temporary release outputs
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          for name in ('android-upload.jks', 'android-beta-state.json', 'bundletool.jar'):
              (pathlib.Path(os.environ['RUNNER_TEMP']) / name).unlink(missing_ok=True)
          root = pathlib.Path('android/app/build').resolve()
          if root.is_relative_to(pathlib.Path.cwd().resolve() / 'android'):
              for path in root.rglob('*.aab'):
                  path.unlink()
          PY
      # Intentionally no artifact upload, release attachment or signing/build cache.
