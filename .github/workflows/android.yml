name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-beta.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "android/**"
      - "contracts/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-beta.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run deterministic unit tests
        run: ./android/gradlew -p android testDebugUnitTest compileDebugAndroidTestKotlin
      - name: Exercise release signing and version guards
        run: python3 android/scripts/test_release_signing.py

  release-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.22"
      - name: Check beta workflow logic (no release credentials)
        working-directory: android/fastlane
        env:
          BUNDLE_FROZEN: "true"
        run: |
          bundle install --jobs 4 --retry 0
          bundle exec ruby tests/beta_release_test.rb
          python3 ../scripts/test_android_beta.py
