plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Environment values take precedence over developer-machine Gradle properties.
def releaseCredential = { String name, String injected ->
    providers.environmentVariable(name).orNull ?:
        providers.gradleProperty(injected).orNull ?: providers.gradleProperty(name).orNull
}
def releaseStore = releaseCredential('ACQUIRING_RELEASE_STORE_FILE', 'android.injected.signing.store.file')
def releaseStorePassword = releaseCredential('ACQUIRING_RELEASE_STORE_PASSWORD', 'android.injected.signing.store.password')
def releaseAlias = releaseCredential('ACQUIRING_RELEASE_KEY_ALIAS', 'android.injected.signing.key.alias')
def releaseKeyPassword = releaseCredential('ACQUIRING_RELEASE_KEY_PASSWORD', 'android.injected.signing.key.password')
def releaseVersionOverride = providers.gradleProperty('ACQUIRING_RELEASE_VERSION_CODE').orNull
if (releaseVersionOverride != null &&
        (!(releaseVersionOverride ==~ /[1-9][0-9]*/) ||
         new BigInteger(releaseVersionOverride) > 2100000000)) {
    throw new GradleException('ACQUIRING_RELEASE_VERSION_CODE must be between 1 and 2100000000')
}

android {
    namespace 'com.acquiring.android'
    compileSdk 36
    
    kapt {
        correctErrorTypes = true
    }

    defaultConfig {
        applicationId "com.acquiring.android"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.0"

        if (releaseVersionOverride != null) {
            if (releaseVersionOverride.toInteger() <= versionCode) {
                throw new GradleException('Release version override must exceed the repository versionCode')
            }
            versionCode releaseVersionOverride.toInteger()
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // Needed for BuildConfig.DEBUG, which gates the app's diagnostic logging.
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        test.resources.srcDir "${rootProject.projectDir}/../contracts/fixtures"
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

// Task-time validation leaves IDE sync and ordinary debug builds credential-free.
def validateUploadSigning = tasks.register('validateAcquiringReleaseSigning') {
    doLast {
        if (![releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }) {
            throw new GradleException('Release signing requires the original upload keystore, alias and both passwords')
        }
        try {
            def keyStore = java.security.KeyStore.getInstance(file(releaseStore), releaseStorePassword.toCharArray())
            if (!(keyStore.getKey(releaseAlias, releaseKeyPassword.toCharArray()) instanceof java.security.PrivateKey)) {
                throw new IllegalArgumentException('Not a private key')
            }
            def digest = java.security.MessageDigest.getInstance('SHA-1')
                .digest(keyStore.getCertificate(releaseAlias).encoded).encodeHex().toString().toUpperCase()
            if (digest != '2CDF87160C0306AD304F4F97E8A1A4AD6EFC4272') {
                throw new GradleException('Upload certificate does not match Google Play; do not replace or reset the key')
            }
        } catch (GradleException error) {
            throw error
        } catch (Exception ignored) {
            // Do not expose keystore paths, aliases, passwords or exception details in CI logs.
            throw new GradleException('Cannot unlock the upload key. Check the keystore, alias and passwords')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(validateUploadSigning)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

    // Networking & Scraping
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jsoup:jsoup:1.16.1'
    
    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
